name: Automated Version Bump & Release Preparation

# Opens the release PR and runs the full CI against its branch (workflow_call), so the
# checks are visible before merging without a personal access token. Tag, GitHub Release
# and PyPI publication are handled by release.yml after the PR is merged.
# The bump commit message must not carry a CI-skip marker: a squash merge reuses it and`n# would suppress the push-triggered release workflow.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version if "custom" selected (e.g. 2.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump Version & Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.bump.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Bump Version in pyproject.toml & CHANGELOG.md
        id: bump
        run: |
          uv run python scripts/bump-version.py --type "${{ github.event.inputs.bump_type }}" --custom "${{ github.event.inputs.custom_version }}"
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=release/$TAG" >> "$GITHUB_OUTPUT"
          echo ">>> New Version: $VERSION"
          echo ">>> New Tag: $TAG"

      - name: Extract Release Notes from CHANGELOG
        run: |
          uv run python scripts/extract-release-notes.py --tag "${{ steps.bump.outputs.tag }}" --output pr_body.md

      - name: Synchronize release metadata
        run: |
          uv lock
          uv run python scripts/generate-tools-doc.py
          uv run python scripts/check-repository-consistency.py

      - name: Create release branch and Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.bump.outputs.branch }}"
          git checkout -b "$BRANCH_NAME"
          git add pyproject.toml uv.lock CHANGELOG.md manifest.json docs/TOOLS.md
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.tag }}"
          git push origin "$BRANCH_NAME" --force
          gh pr create \
            --head "$BRANCH_NAME" \
            --base master \
            --title "chore(release): prepare release ${{ steps.bump.outputs.tag }}" \
            --body-file pr_body.md || echo "Pull request already exists or created"

  ci:
    name: CI on release branch
    needs: bump
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}
