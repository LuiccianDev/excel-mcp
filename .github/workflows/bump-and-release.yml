name: Automated Version Bump & Release Preparation

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version if "custom" selected (e.g. 2.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump Version & Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.bump.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Bump Version in pyproject.toml & CHANGELOG.md
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          uv run python scripts/bump-version.py --type "$BUMP_TYPE" --custom "$CUSTOM_VERSION"
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=release/$TAG" >> "$GITHUB_OUTPUT"
          echo ">>> New Version: $VERSION"
          echo ">>> New Tag: $TAG"

      - name: Extract Release Notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          uv run python scripts/extract-release-notes.py --tag "$RELEASE_TAG" --output pr_body.md

      - name: Synchronize release metadata
        run: |
          uv lock
          uv run python scripts/generate-tools-doc.py
          uv run python scripts/check-repository-consistency.py

      - name: Create release branch and Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.bump.outputs.branch }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git checkout -b "$BRANCH_NAME"
          git add pyproject.toml uv.lock CHANGELOG.md manifest.json docs/TOOLS.md
          git commit -m "chore(release): bump version to $RELEASE_TAG"
          git push origin "$BRANCH_NAME" --force-with-lease
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base master --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --head "$BRANCH_NAME" \
              --base master \
              --title "chore(release): prepare release $RELEASE_TAG" \
              --body-file pr_body.md
          else
            echo "Pull request #$EXISTING_PR already exists for $BRANCH_NAME"
          fi

  ci:
    name: CI on release branch
    needs: bump
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}
