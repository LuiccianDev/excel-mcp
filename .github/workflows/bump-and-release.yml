name: Automated Version Bump & Release Preparation

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version if "custom" selected (e.g. 2.1.0)'
        required: false
        default: ''
        type: string
      create_pr:
        description: 'Create a Pull Request instead of direct tag release'
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump Version & Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Bump Version in pyproject.toml & CHANGELOG.md
        id: bump
        run: |
          uv run python scripts/bump-version.py --type "${{ github.event.inputs.bump_type }}" --custom "${{ github.event.inputs.custom_version }}"
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo ">>> New Version: $VERSION"
          echo ">>> New Tag: $TAG"

      - name: Extract Release Notes from CHANGELOG
        run: |
          uv run python scripts/extract-release-notes.py --tag "${{ steps.bump.outputs.tag }}" --output pr_body.md

      - name: Synchronize release metadata
        run: |
          uv lock
          uv run python scripts/generate-tools-doc.py
          uv run python scripts/check-repository-consistency.py

      - name: Create Pull Request (Recommended Mode)
        if: ${{ github.event.inputs.create_pr == true || github.event.inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="release/${{ steps.bump.outputs.tag }}"
          git checkout -b "$BRANCH_NAME"
          git add pyproject.toml uv.lock CHANGELOG.md manifest.json docs/TOOLS.md
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.tag }} [skip ci]"
          git push origin "$BRANCH_NAME" --force
          gh pr create \
            --head "$BRANCH_NAME" \
            --base master \
            --title "chore(release): prepare release ${{ steps.bump.outputs.tag }}" \
            --body-file pr_body.md || echo "Pull request already exists or created"

      - name: Direct Commit & Tag on master (Alternative Mode)
        if: ${{ github.event.inputs.create_pr == false || github.event.inputs.create_pr == 'false' }}
        run: |
          git add pyproject.toml uv.lock CHANGELOG.md manifest.json docs/TOOLS.md
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          CURRENT_BRANCH=$(git branch --show-current || echo "master")
          git push origin "$CURRENT_BRANCH" --tags
