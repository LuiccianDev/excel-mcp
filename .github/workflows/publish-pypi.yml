name: Publish to PyPI (manual recovery)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v2.1.4)'
        required: true
        type: string
      target_env:
        description: 'Target repository'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Attest & Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.target_env }}
      url: ${{ (github.event.inputs.target_env == 'testpypi') && 'https://test.pypi.org/p/luiccian-excel-mcp' || 'https://pypi.org/p/luiccian-excel-mcp' }}
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Validate tag format
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$INPUT_TAG' must match vX.Y.Z"
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Verify tag is an ancestor of master
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          git fetch origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::Tag $INPUT_TAG commit is not an ancestor of master"
            exit 1
          }

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Verify tag matches package version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: uv run python scripts/check-repository-consistency.py --tag "$INPUT_TAG"

      - name: Build sdist and wheel
        run: uv build

      - name: Generate GitHub artifact attestation (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (production)
        if: ${{ github.event.inputs.target_env == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.target_env == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
