name: Publish to PyPI (manual recovery)

# Recovery only. The normal path is release.yml, which builds once, creates the tag
# and the GitHub Release, and publishes the same artifacts to PyPI. Use this workflow
# only when a PyPI upload failed after the GitHub Release already exists.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v2.1.4)'
        required: true
        type: string
      target_env:
        description: 'Target repository'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Attest & Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.target_env }}
      url: ${{ (github.event.inputs.target_env == 'testpypi') && 'https://test.pypi.org/p/luiccian-excel-mcp' || 'https://pypi.org/p/luiccian-excel-mcp' }}
    permissions:
      id-token: write        # Trusted Publishing (OIDC)
      attestations: write    # PEP 740 attestations
      contents: read

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: uv run python scripts/check-repository-consistency.py --tag "${{ github.event.inputs.tag }}"

      - name: Build sdist and wheel
        run: uv build

      - name: Generate GitHub artifact attestation (SLSA provenance)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (production)
        if: ${{ github.event.inputs.target_env == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.target_env == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
