name: Release - Tag, GitHub Release & PyPI

# Tag-driven release pipeline. Releases are triggered exclusively when an official
# semver Git tag (v*.*.*) is pushed (aligned with PyPA and VS Code practices).
# Normal flow: prepare version in master -> tag commit (e.g. v2.1.6) -> push tag.
# Recovery for a failed PyPI upload: run publish-pypi.yml manually with the tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish (e.g. v2.1.6)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.state.outputs.tag }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Validate tag consistency
        id: state
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          uv run python scripts/check-repository-consistency.py --tag "$TAG"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (Python ${{ matrix.python-version }})
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linter (ruff)
        run: uv run ruff check .

      - name: Verify formatting (ruff format)
        run: uv run ruff format --check .

      - name: Run type checker (mypy)
        run: uv run mypy src

      - name: Run test suite (pytest + coverage gate)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Verify repository consistency and tag
        run: uv run python scripts/check-repository-consistency.py --tag "${{ needs.verify-tag.outputs.tag }}"

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build sdist and wheel (once)
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Create tag and GitHub Release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Extract release notes from CHANGELOG
        run: python3 scripts/extract-release-notes.py --tag "${{ needs.verify-tag.outputs.tag }}" --output release_body.md

      - name: Create tag and release on the verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.verify-tag.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "Release ${{ needs.verify-tag.outputs.tag }}" \
            --notes-file release_body.md \
            --generate-notes \
            --latest

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-tag, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/luiccian-excel-mcp
    permissions:
      id-token: write        # Trusted Publishing (OIDC)
      attestations: write    # PEP 740 attestations
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Generate GitHub artifact attestation (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (OIDC + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
