name: Release - Tag, GitHub Release & PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish (e.g. v2.1.6)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.state.outputs.tag }}
      version: ${{ steps.state.outputs.version }}
      sha: ${{ steps.state.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Validate tag consistency
        id: state
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must match vX.Y.Z"
            exit 1
          fi
          git fetch --tags origin master
          TAG_SHA=$(git rev-parse --verify "refs/tags/${TAG}^{commit}") || {
            echo "::error::Tag refs/tags/$TAG does not exist"
            exit 1
          }
          if [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked out HEAD does not match tag commit $TAG_SHA"
            exit 1
          fi
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::Tag $TAG commit is not an ancestor of master"
            exit 1
          }
          uv run python scripts/check-repository-consistency.py --tag "$TAG"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Build sdist and wheel (once)
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Create tag and GitHub Release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/extract-release-notes.py --tag "$RELEASE_TAG" --output release_body.md

      - name: Create tag and release on the verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$RELEASE_SHA" \
            --title "Release $RELEASE_TAG" \
            --notes-file release_body.md \
            --generate-notes \
            --latest

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-tag, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/luiccian-excel-mcp
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Generate GitHub artifact attestation (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (OIDC + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
