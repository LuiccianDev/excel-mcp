name: CI - Build & Test

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - '.gitignore'
      - '.gitattributes'
      - '.mcpbignore'
      - '.dockerignore'
      - 'Dockerfile'
      - '.vscode/**'
      - '.python-version'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - '.gitignore'
      - '.gitattributes'
      - '.mcpbignore'
      - '.dockerignore'
      - 'Dockerfile'
      - '.vscode/**'
      - '.python-version'
      - '.env.example'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
         python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linter (ruff)
        run: uv run ruff check . --output-format=github

      - name: Verify formatting (ruff format)
        run: uv run ruff format --check .

      - name: Run type checker (mypy)
        run: uv run mypy src

      - name: Run test suite (pytest + coverage gate)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Verify repository consistency
        run: uv run python scripts/check-repository-consistency.py

      - name: Build distributions
        run: uv run python -m build
