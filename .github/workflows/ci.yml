name: CI - Build & Test

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - '.gitignore'
      - '.gitattributes'
      - '.mcpbignore'
      - '.dockerignore'
      - 'Dockerfile'
      - '.vscode/**'
      - '.python-version'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - '.gitignore'
      - '.gitattributes'
      - '.mcpbignore'
      - '.dockerignore'
      - 'Dockerfile'
      - '.vscode/**'
      - '.python-version'
      - '.env.example'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (used by the release PR workflow)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
         python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linter (ruff)
        run: uv run ruff check . --output-format=github

      - name: Verify formatting (ruff format)
        run: uv run ruff format --check .

      - name: Run type checker (mypy)
        run: uv run mypy src

      - name: Run test suite (pytest + coverage gate)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Verify repository consistency
        run: uv run python scripts/check-repository-consistency.py

      - name: Build distributions
        run: uv run python -m build
