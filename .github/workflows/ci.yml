name: CI - Build & Test

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - '.gitignore'
      - '.gitattributes'
      - '.mcpbignore'
      - '.vscode/**'
      - '.python-version'
      - 'LICENSE'
      - '.agents/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (used by the release PR workflow)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
         python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify PR does not bump version directly
        if: github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          set -euo pipefail
          git rev-parse --verify "origin/${BASE_REF}" >/dev/null
          diff_output="$(git diff "origin/${BASE_REF}...HEAD" -- pyproject.toml)"
          if printf '%s\n' "${diff_output}" | grep -Eq '^\+[[:space:]]*version[[:space:]]*='; then
            echo "::error::Direct version bumps are forbidden in regular PRs. Use the automated release pipeline instead."
            exit 1
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linter (ruff)
        run: uv run ruff check . --output-format=github

      - name: Verify formatting (ruff format)
        run: uv run ruff format --check .

      - name: Run type checker (mypy)
        run: uv run mypy src

      - name: Run test suite (pytest + coverage gate)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Verify repository consistency
        run: uv run python scripts/check-repository-consistency.py

      - name: Build distributions
        run: uv run python -m build
