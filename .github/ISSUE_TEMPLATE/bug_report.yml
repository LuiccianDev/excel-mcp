name: Bug report
description: Report a reproducible defect in Excel MCP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest command, MCP call, or workbook that reproduces the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, package version, and uv version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and test evidence
      description: Include relevant stderr, traceback, and commands already executed.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability. I will use SECURITY.md for security reports.
          required: true
