[project]
name = "luiccian-excel-mcp"
version = "2.1.5"
description = "High-performance Model Context Protocol (MCP) server for Excel (.xlsx) spreadsheet automation and generation"
readme = "README.md"
authors = [
    {name = "LuiccianDev", email = "luicciandev@gmail.com"}
]
license = {text = "Apache-2.0"}
keywords = ["mcp", "model-context-protocol", "excel", "office", "xlsx", "llm", "automation", "spreadsheet"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=3.0.0",
    "mcp[cli]>=1.12.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/LuiccianDev/excel-mcp"
Repository = "https://github.com/LuiccianDev/excel-mcp"
Documentation = "https://github.com/LuiccianDev/excel-mcp/blob/master/README.md"
Issues = "https://github.com/LuiccianDev/excel-mcp/issues"
Changelog = "https://github.com/LuiccianDev/excel-mcp/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[project.scripts]
excel-mcp = "excel_mcp.__main__:main"
excel_mcp = "excel_mcp.__main__:main"
mcp-excel = "excel_mcp.__main__:main"
mcp_excel = "excel_mcp.__main__:main"

[project.entry-points."mcp.servers"]
excel-mcp = "excel_mcp.__main__:main"
excel_mcp = "excel_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/excel_mcp",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/tests",
    "/scripts",
    "/docs",
    "/skills",
    "/.github",
    "/scratch",
    "/.vscode",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Tool Configurations (PEP 518 / PEP 621)
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "W291",  # trailing whitespace
    "E501",  # line too long, handled by black/formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["excel_mcp"]
combine-as-imports = true
order-by-type = true
case-sensitive = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["excel_mcp"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "\\.venv/"]
files = ["src"]
